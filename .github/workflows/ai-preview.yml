name: Preview latest Telegram post (NO FACEBOOK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - facebook-simple-reader-v2
    paths:
      - ".github/validation-trigger.txt"

permissions:
  contents: read

jobs:
  dry-run-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate code, MSA, rights policy and media safeguards
        run: |
          python -m py_compile             telegram_collector.py             ai_rewriter.py             ai_batch_processor.py             image_resolver.py             facebook_publisher.py             merge_pipeline_state.py             validate_pipeline.py             preview_latest_post.py             preview_specific_item.py
          python validate_pipeline.py

      - name: Ensure FFmpeg is available for video previews
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Validate known 13.60 regression item through AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          AI_HTTP_TIMEOUT_SECONDS: 20
          AI_HTTP_ATTEMPTS: 1
        run: python preview_specific_item.py 1693

      - name: Generate one complete dry-run preview
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          AI_HTTP_TIMEOUT_SECONDS: 20
          AI_HTTP_ATTEMPTS: 1
        run: python preview_latest_post.py

      - name: Show preview in GitHub summary
        if: always()
        shell: bash
        run: |
          if [ -f preview-output/summary.md ]; then
            cat preview-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Preview failed before output was created" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preview files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyberoplus-post-preview
          path: preview-output/
          if-no-files-found: warn
          retention-days: 7
