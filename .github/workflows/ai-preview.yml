name: Preview latest Telegram post (NO FACEBOOK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure FFmpeg is available for video previews
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Generate one complete dry-run preview
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
        run: python preview_latest_post.py

      - name: Show preview in GitHub summary
        if: always()
        shell: bash
        run: |
          if [ -f preview-output/summary.md ]; then
            cat preview-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Preview failed before output was created" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preview files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyberoplus-post-preview
          path: preview-output/
          if-no-files-found: warn
          retention-days: 7
