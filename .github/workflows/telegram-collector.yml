# Cybero Plus production pipeline
name: Telegram to Facebook publisher

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions' shortest supported scheduled cadence is every 5 minutes.
    # Backup heartbeat; the worker also queues its successor after a short pause.
    - cron: "2-59/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/production-trigger.txt"
      - ".github/workflows/telegram-collector.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  collect-prepare-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Cheap preflight — skip idle runs
        id: probe
        run: python pipeline_probe.py

      - name: Idle — nothing to collect, retry or publish
        if: steps.probe.outputs.needs_run != 'true'
        run: echo "Pipeline is up to date. Expensive setup skipped."

      - name: Set up Python
        if: steps.probe.outputs.needs_run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.probe.outputs.needs_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Collect every new Telegram post
        id: collect
        if: steps.probe.outputs.needs_run == 'true'
        # A source outage must not block the durable AI/Facebook queues.
        continue-on-error: true
        run: python telegram_collector.py

      - name: Install FFmpeg for any already-ready video
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          from video_rights import evaluate_video_rights

          def rows(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") in {"published", "duplicate_skipped"}
          }
          pending = [
              row for row in ready
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) > 0
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          needs_video = any(
              (row.get("media") or {}).get("has_video")
              and evaluate_video_rights(row).reupload_allowed
              for row in pending
          )
          raise SystemExit(0 if needs_video else 1)
          PY
          then
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
          else
            echo "No already-ready video requires FFmpeg."
          fi

      - name: Publish at most one eligible Facebook item before AI
        if: steps.probe.outputs.needs_run == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python facebook_publisher.py

      - name: Prepare every unprocessed item in Arabic
        if: steps.probe.outputs.needs_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          AI_HTTP_TIMEOUT_SECONDS: 60
          AI_HTTP_ATTEMPTS: 2
          AI_ITEM_ATTEMPTS: 1
        run: python ai_batch_processor.py

      - name: Install FFmpeg only when the next post needs video
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          from video_rights import evaluate_video_rights

          def rows(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") in {"published", "duplicate_skipped"}
          }
          pending = [
              row
              for row in sorted(ready, key=lambda item: int(item.get("telegram_id", 0) or 0))
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          needs_video = any(
              (row.get("media") or {}).get("has_video")
              and evaluate_video_rights(row).reupload_allowed
              for row in pending
          )
          raise SystemExit(0 if needs_video else 1)
          PY
          then
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
            ffmpeg -version | head -n 1
          else
            echo "The next pending post does not need FFmpeg."
          fi

      - name: Publish at most one eligible Facebook item after AI
        if: steps.probe.outputs.needs_run == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python facebook_publisher.py

      - name: Persist pipeline state without rebase conflicts
        if: always() && steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          files=(
            data/state.json
            data/inbox.jsonl
            data/ai_state.json
            data/ready.jsonl
            data/facebook_events.jsonl
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No pipeline changes to persist."
            exit 0
          fi

          snapshot="$(mktemp -d)"
          for file in "${files[@]}"; do
            mkdir -p "$snapshot/$(dirname "$file")"
            cp "$file" "$snapshot/$file"
          done

          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "State persistence attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            # Merge this run's snapshot into the newest remote state instead of
            # rebasing append-only JSONL files and risking content conflicts.
            python merge_pipeline_state.py "$snapshot/data"

            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "Latest main already contains this run's state."
              exit 0
            fi

            git commit -m "Persist Facebook publishing pipeline state"
            if git push origin HEAD:main; then
              echo "Pipeline state persisted safely."
              exit 0
            fi

            echo "Remote changed during push; merging again against latest main."
          done

          echo "Unable to persist pipeline state after 3 merge attempts." >&2
          exit 1

      - name: Pipeline budget summary
        if: always()
        run: |
          echo "### Cybero Plus pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: \`${{ steps.probe.outputs.reason }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full pipeline ran: \`${{ steps.probe.outputs.needs_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Telegram collector: \`${{ steps.collect.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.collect.outcome }}" = "failure" ]; then
            echo "::warning::Telegram collection failed; existing AI/Facebook queues continued and the next cycle will retry the source."
          fi
          echo "- Polling: continuous successor runs with a 60-second pause; 5-minute schedule is backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Queue policy: one priority item per publisher attempt; 5-minute minimum gap from config" >> "$GITHUB_STEP_SUMMARY"

      - name: Pace continuous monitoring
        if: always() && github.ref == 'refs/heads/main'
        run: sleep 60

      - name: Continue publisher cycle
        # Idle and dispatched runs must keep monitoring when cron is delayed.
        # The pause above bounds idle polling; Facebook retains its 5-minute gap.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "telegram-collector.yml",
              branch: "main",
              per_page: 10,
            });
            const activeStatuses = new Set(["queued", "in_progress", "waiting", "pending"]);
            const otherActive = response.data.workflow_runs.some(
              run => run.id !== context.runId && activeStatuses.has(run.status)
            );
            if (otherActive) {
              core.info("A successor publisher run is already active or queued.");
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "telegram-collector.yml",
                ref: "main",
              });
              core.info("Queued exactly one successor publisher cycle.");
            }
