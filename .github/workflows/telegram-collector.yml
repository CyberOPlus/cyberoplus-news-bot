# Cybero Plus production pipeline
name: Telegram to Facebook publisher

on:
  # Maintenance mode: automatic triggers are intentionally disabled while the
  # production pipeline is being repaired and validated.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  collect-prepare-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Cheap preflight — skip idle runs
        id: probe
        run: python pipeline_probe.py

      - name: Idle — nothing to collect, retry or publish
        if: steps.probe.outputs.needs_run != 'true'
        run: echo "Pipeline is up to date. Expensive setup skipped."

      - name: Set up Python
        if: steps.probe.outputs.needs_run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.probe.outputs.needs_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Collect every new Telegram post
        if: steps.probe.outputs.needs_run == 'true'
        run: python telegram_collector.py

      - name: Install FFmpeg for any already-ready video
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") == "published"
          }
          pending = [
              row for row in ready
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) > 0
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          raise SystemExit(0 if any((row.get("media") or {}).get("has_video") for row in pending) else 1)
          PY
          then
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
          else
            echo "No already-ready video requires FFmpeg."
          fi

      - name: Drain already-ready Facebook backlog before AI
        if: steps.probe.outputs.needs_run == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_MIN_GAP_MINUTES: 0
        shell: bash
        run: |
          set -euo pipefail
          published_this_run=0
          while python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") == "published"
          }
          pending = [
              row for row in ready
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) > 0
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          raise SystemExit(0 if pending else 1)
          PY
          do
            python facebook_publisher.py
            published_this_run=$((published_this_run + 1))
            if [ "$published_this_run" -ge 100 ]; then
              echo "Safety stop: 100 Facebook posts processed before AI." >&2
              exit 1
            fi
          done
          echo "Published $published_this_run already-ready item(s) before AI."

      - name: Prepare every unprocessed item in Arabic
        if: steps.probe.outputs.needs_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          AI_HTTP_TIMEOUT_SECONDS: 20
          AI_HTTP_ATTEMPTS: 1
          AI_ITEM_ATTEMPTS: 1
        run: python ai_batch_processor.py

      - name: Install FFmpeg only when the next post needs video
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") == "published"
          }
          pending = [
              row
              for row in sorted(ready, key=lambda item: int(item.get("telegram_id", 0) or 0))
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          needs_video = any((row.get("media") or {}).get("has_video") for row in pending)
          raise SystemExit(0 if needs_video else 1)
          PY
          then
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
            ffmpeg -version | head -n 1
          else
            echo "The next pending post does not need FFmpeg."
          fi

      - name: Publish every ready item to Facebook immediately
        if: steps.probe.outputs.needs_run == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_MIN_GAP_MINUTES: 0
        shell: bash
        run: |
          set -euo pipefail
          published_this_run=0

          while python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              return [
                  json.loads(line)
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          ready = rows(Path("data/ready.jsonl"))
          events = rows(Path("data/facebook_events.jsonl"))
          published = {
              int(row.get("telegram_id", 0) or 0)
              for row in events
              if row.get("event") == "published"
          }
          pending = [
              row
              for row in ready
              if row.get("status") == "ready"
              and int(row.get("telegram_id", 0) or 0) > 0
              and int(row.get("telegram_id", 0) or 0) not in published
          ]
          raise SystemExit(0 if pending else 1)
          PY
          do
            python facebook_publisher.py
            published_this_run=$((published_this_run + 1))

            # Safety guard against a corrupted queue causing an endless loop.
            if [ "$published_this_run" -ge 100 ]; then
              echo "Safety stop: 100 Facebook posts processed in one workflow run." >&2
              exit 1
            fi
          done

          echo "Published $published_this_run queued item(s) in this run."

      - name: Persist pipeline state without rebase conflicts
        if: always() && steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          files=(
            data/state.json
            data/inbox.jsonl
            data/ai_state.json
            data/ready.jsonl
            data/facebook_events.jsonl
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No pipeline changes to persist."
            exit 0
          fi

          snapshot="$(mktemp -d)"
          for file in "${files[@]}"; do
            mkdir -p "$snapshot/$(dirname "$file")"
            cp "$file" "$snapshot/$file"
          done

          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "State persistence attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            # Merge this run's snapshot into the newest remote state instead of
            # rebasing append-only JSONL files and risking content conflicts.
            python merge_pipeline_state.py "$snapshot/data"

            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "Latest main already contains this run's state."
              exit 0
            fi

            git commit -m "Persist Facebook publishing pipeline state"
            if git push origin HEAD:main; then
              echo "Pipeline state persisted safely."
              exit 0
            fi

            echo "Remote changed during push; merging again against latest main."
          done

          echo "Unable to persist pipeline state after 3 merge attempts." >&2
          exit 1

      - name: Pipeline budget summary
        if: always()
        run: |
          echo "### Cybero Plus pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: \`${{ steps.probe.outputs.reason }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full pipeline ran: \`${{ steps.probe.outputs.needs_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: every 5 minutes, staggered from minute 2 (GitHub Actions)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Queue policy: publish every ready item immediately; no intentional Facebook gap" >> "$GITHUB_STEP_SUMMARY"
