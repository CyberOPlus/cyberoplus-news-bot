name: Telegram collector

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "telegram_collector.py"
      - "requirements.txt"
      - ".github/workflows/telegram-collector.yml"

permissions:
  contents: write

concurrency:
  group: telegram-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect every new Telegram post
        run: python telegram_collector.py

      - name: Persist collector state and inbox
        shell: bash
        run: |
          if git diff --quiet -- data/state.json data/inbox.jsonl; then
            echo "No new Telegram posts to persist."
            exit 0
          fi

          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/inbox.jsonl
          git commit -m "Collect new Telegram posts"
          git push
