name: Telegram to Facebook publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "telegram_collector.py"
      - "ai_batch_processor.py"
      - "ai_rewriter.py"
      - "facebook_publisher.py"
      - "prompts/facebook_ar.txt"
      - "requirements.txt"
      - ".github/workflows/telegram-collector.yml"

permissions:
  contents: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  collect-prepare-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect every new Telegram post
        run: python telegram_collector.py

      - name: Prepare every unprocessed item in Arabic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: meta-llama/llama-3.3-70b-instruct:free
        run: python ai_batch_processor.py

      - name: Publish next ready item to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_MIN_GAP_MINUTES: 12
        run: python facebook_publisher.py

      - name: Persist pipeline state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/state.json data/inbox.jsonl data/ai_state.json data/ready.jsonl data/facebook_events.jsonl; then
            echo "No pipeline changes to persist."
            exit 0
          fi

          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/inbox.jsonl data/ai_state.json data/ready.jsonl data/facebook_events.jsonl
          git commit -m "Persist Facebook publishing pipeline state"
          git push
