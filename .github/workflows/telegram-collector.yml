name: Telegram to Facebook ready queue

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "telegram_collector.py"
      - "ai_batch_processor.py"
      - "ai_rewriter.py"
      - "prompts/facebook_ar.txt"
      - "requirements.txt"
      - ".github/workflows/telegram-collector.yml"

permissions:
  contents: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  collect-and-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect every new Telegram post
        run: python telegram_collector.py

      - name: Prepare every unprocessed item in Arabic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
        run: python ai_batch_processor.py

      - name: Persist inbox, AI state and ready queue
        shell: bash
        run: |
          if git diff --quiet -- data/state.json data/inbox.jsonl data/ai_state.json data/ready.jsonl; then
            echo "No pipeline changes to persist."
            exit 0
          fi

          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/inbox.jsonl data/ai_state.json data/ready.jsonl
          git commit -m "Collect and prepare new Facebook posts"
          git push
