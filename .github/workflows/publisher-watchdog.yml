name: Publisher watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Telegram to Facebook publisher"]
    types: [completed]
    branches: [main]
  schedule:
    # Backup heartbeat. Production polls every 5 minutes; watchdog checks every 10.
    # It only intervenes when the production heartbeat goes stale.
    - cron: "4,14,24,34,44,54 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/watchdog-trigger.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: publisher-watchdog-main
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Wake publisher if production is stale
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          workflow = "telegram-collector.yml"

          def request(url, method="GET", data=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "publisher-watchdog",
              }
              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, headers=headers, method=method, data=body)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          runs = request(
              f"{api}/repos/{repo}/actions/workflows/{workflow}/runs"
              "?branch=main&per_page=5"
          ).get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          newest = None
          active = False
          for run in runs:
              if run.get("status") in {"queued", "in_progress", "waiting", "pending"}:
                  active = True
              created = run.get("created_at")
              if created:
                  stamp = datetime.fromisoformat(created.replace("Z", "+00:00"))
                  if newest is None or stamp > newest:
                      newest = stamp

          if active:
              print("Production workflow is already active; watchdog does nothing.")
              raise SystemExit(0)

          age_minutes = None if newest is None else (now - newest).total_seconds() / 60
          # Completion without an active successor means the chain broke.
          # Recover immediately, including after cancellation/timeout/setup errors.
          chain_ended = os.environ.get("GITHUB_EVENT_NAME") == "workflow_run"
          if not chain_ended and age_minutes is not None and age_minutes < 8:
              print(f"Production heartbeat is healthy ({age_minutes:.1f} minutes old).")
              raise SystemExit(0)

          request(
              f"{api}/repos/{repo}/actions/workflows/{workflow}/dispatches",
              method="POST",
              data={"ref": "main"},
          )
          print(
              "Production workflow was stale"
              + ("" if age_minutes is None else f" ({age_minutes:.1f} minutes)")
              + "; watchdog dispatched it."
          )
          PY
