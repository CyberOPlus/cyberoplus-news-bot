# final-pass
# One-time live validation after cleanup
name: Test latest three Facebook posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-three-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish and verify latest three Darija posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        run: python test_last_three.py
