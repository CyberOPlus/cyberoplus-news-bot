name: LIVE TEST — selected Telegram posts to Facebook

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  publish-exact-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Publish selected Telegram posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.7-flash,gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: openrouter/free
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        run: python test_last_three.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-facebook-test-selected
          path: live-test-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Persist publication events
        if: always()
        shell: bash
        run: |
          git config user.name "cyberoplus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/facebook_events.jsonl
          if git diff --cached --quiet; then
            echo "No event changes."
            exit 0
          fi
          git commit -m "Persist live Facebook test events [skip ci]"
          git pull --rebase origin main
          git push
