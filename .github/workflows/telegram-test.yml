name: Telegram source smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "telegram_test.py"
      - "requirements.txt"
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Read latest Telegram post
        run: python telegram_test.py
