name: Public repository keepalive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-facebook-pipeline
  cancel-in-progress: false

jobs:
  keepalive:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Record monthly activity
        shell: bash
        run: |
          month="$(date -u +'%Y-%m')"
          file=".github/public-keepalive.txt"

          if [ -f "$file" ] && grep -qx "$month" "$file"; then
            echo "Keepalive already recorded for $month."
            exit 0
          fi

          printf '%s\n' "$month" > "$file"
          git config user.name "cyberoplus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$file"
          git commit -m "Monthly public-repo keepalive [skip ci]"
          git pull --rebase origin main
          git push
